name: Validate aieco
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests

      - name: Probe OpenAI official feeds (diagnostic)
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          urls = [
            "https://openai.com/news/rss.xml",
            "https://openai.com/sitemap.xml",
            "https://openai.com/news/research/rss.xml",
            "https://openai.com/robots.txt",
            "https://cdn.openai.com/signals/data-dictionary.pdf",
            "https://openai.com/signals/data-download/",
          ]
          for url in urls:
            try:
              with urlopen(Request(url, headers={"User-Agent":"aieco-indexer/0.1 (+https://github.com/XXXDDD/aieco)"}), timeout=15) as resp:
                print(url, resp.status, resp.headers.get("Content-Type"), repr(resp.read(90)))
            except Exception as exc:
              print(url, type(exc).__name__, str(exc))
          import xml.etree.ElementTree as ET
          rss = ET.fromstring(urlopen(Request("https://openai.com/news/rss.xml", headers={"User-Agent":"aieco-indexer/0.1 (+https://github.com/XXXDDD/aieco)"}), timeout=15).read(6000000))
          items = rss.findall(".//item")
          print("RSS total items:", len(items))
          for item in items[:12]:
            print("RSS ITEM:", {tag: item.findtext(tag) for tag in ("title","link","pubDate","category")})
          site = ET.fromstring(urlopen(Request("https://openai.com/sitemap.xml", headers={"User-Agent":"aieco-indexer/0.1 (+https://github.com/XXXDDD/aieco)"}), timeout=15).read(6000000))
          print("SITEMAP:", [(x.tag.rsplit("}",1)[-1],x.text) for el in list(site)[:10] for x in list(el)[:1]])
          PY
